{% extends 'admin_base.html' %}

{% block title %}ยืนยันการลบ — CS RANDOM QUIZ{% endblock %}

{% block admin_content %}
<div class="admin-card" style="max-width: 500px; margin: 3rem auto; text-align: center; padding: 2.5rem;">
  <div style="font-size: 3.5rem; margin-bottom: 1rem;">⚠️</div>
  <h1 class="admin-card-title" style="font-size: 1.4rem; color: #b91c1c; margin-bottom: 0.5rem;">
    ยืนยันการลบ {{ type }}
  </h1>
  
  <p style="color: #475569; margin-bottom: 1.8rem; font-size: 1rem;">
    คุณแน่ใจหรือไม่ว่าต้องการลบรายการ <strong>"{{ object }}"</strong> ?<br>
    <small style="color: #94a3b8;">การกระทำนี้ไม่สามารถเรียกคืนข้อมูลได้</small>
  </p>

  <form method="POST" style="display: flex; justify-content: center; gap: 1rem;">
    {% csrf_token %}
    <a href="{% url cancel_url %}" class="btn-secondary-cancel">ยกเลิก</a>
    <button type="submit" class="btn-primary-save" style="background: #ef4444; box-shadow: 0 4px 14px rgba(239, 68, 68, 0.4);">
      🗑️ ยืนยันการลบ
    </button>
  </form>
</div>
{% endblock %}
