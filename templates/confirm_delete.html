{% extends 'admin_base.html' %}

{% block title %}ยืนยันการลบ {{ type }} — CS RANDOM QUIZ{% endblock %}

{% block admin_content %}
<div class="admin-card" style="max-width: 520px; margin: 3.5rem auto; text-align: center; padding: 2.8rem 2.2rem; border-radius: 28px; box-shadow: 0 25px 60px -15px rgba(239, 68, 68, 0.2); border: 1px solid #fee2e2; background: linear-gradient(180deg, #ffffff 0%, #fffbfb 100%);">
  <!-- Glowing Warning Icon -->
  <div style="width: 84px; height: 84px; margin: 0 auto 1.5rem auto; border-radius: 50%; background: #fef2f2; border: 2px solid #fecaca; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; box-shadow: 0 0 25px rgba(239, 68, 68, 0.2); animation: pulseWarn 2s infinite ease-in-out;">
    ⚠️
  </div>

  <h1 class="admin-card-title" style="font-size: 1.55rem; font-weight: 800; color: #991b1b; margin-bottom: 0.75rem;">
    ยืนยันการลบ {{ type }}
  </h1>
  
  <p style="color: #475569; margin-bottom: 2rem; font-size: 1.05rem; line-height: 1.6;">
    คุณแน่ใจหรือไม่ว่าต้องการลบรายการนี้?<br>
    <span style="display: inline-block; margin-top: 0.4rem; padding: 0.5rem 1rem; background: #f8fafc; border-radius: 12px; border: 1px solid #e2e8f0; font-weight: 700; color: #0f172a; word-break: break-word;">
      "{{ object }}"
    </span>
    <br>
    <small style="color: #ef4444; font-weight: 600; display: inline-block; margin-top: 0.6rem;">⚠️ การกระทำนี้ไม่สามารถย้อนกลับหรือกู้คืนได้</small>
  </p>

  <form method="POST" style="display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap;">
    {% csrf_token %}
    <a href="{% url cancel_url %}" class="btn-secondary-cancel" style="padding: 0.8rem 1.6rem; font-size: 1rem; border-radius: 14px; font-weight: 600;">
      ยกเลิก
    </a>
    <button type="submit" class="btn-primary-save" style="background: linear-gradient(135deg, #ef4444, #dc2626); box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4); padding: 0.8rem 1.8rem; font-size: 1rem; border-radius: 14px; font-weight: 700;">
      🗑️ ยืนยันการลบถาวร
    </button>
  </form>
</div>

<style>
@keyframes pulseWarn {
  0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(239, 68, 68, 0.15); }
  50% { transform: scale(1.06); box-shadow: 0 0 35px rgba(239, 68, 68, 0.35); }
}
</style>
{% endblock %}
