{% load static %}
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}CS RANDOM QUIZ — ระบบสุ่มคำถามวิทยาการคอมพิวเตอร์{% endblock %}</title>
  
  <!-- Google Fonts: Prompt & Kanit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Prompt:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  
  <!-- Chart.js CDN for Analytics Doughnut Chart -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Canvas Confetti CDN for Celebratory Answer Screen -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <!-- SweetAlert2 CDN for Beautiful Modern Dialogs & Alerts -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- Sound Effects Synthesizer (Web Audio API) -->
  <script src="{% static 'js/sound_effects.js' %}"></script>

  <!-- Firebase Web SDK (v10 Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCASWXjm222OjJ1Bm90on46qNA0dPLuwkE",
      authDomain: "random-cs-57d01.firebaseapp.com",
      projectId: "random-cs-57d01",
      storageBucket: "random-cs-57d01.firebasestorage.app",
      messagingSenderId: "967552966443",
      appId: "1:967552966443:web:5ca944015aebd47fff2f6e"
    };
    try {
      if (typeof firebase !== 'undefined') {
        firebase.initializeApp(firebaseConfig);
        window.firebaseDb = firebase.firestore();
      }
    } catch(e) {}
  </script>

  <!-- Custom Vanilla CSS -->
  <link rel="stylesheet" href="{% static 'css/style.css' %}">

  <!-- SweetAlert2 Embedded Theme Styling -->
  <style>
    div.swal2-container:not(.swal2-top-end):not(.swal2-toast-shown):not(.swal2-no-backdrop) {
      font-family: 'Prompt', 'Kanit', sans-serif !important;
      backdrop-filter: blur(5px) !important;
      -webkit-backdrop-filter: blur(5px) !important;
      background: rgba(15, 23, 42, 0.45) !important;
    }
    div.swal2-container.swal2-top-end,
    div.swal2-container.swal2-toast-shown,
    body.swal2-toast-shown div.swal2-container {
      background: transparent !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      box-shadow: none !important;
      pointer-events: none !important;
    }
    div.swal2-popup:not(.swal2-toast) {
      font-family: 'Prompt', 'Kanit', sans-serif !important;
      border-radius: 28px !important;
      padding: 2.2rem 1.8rem !important;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.3) !important;
      border: 1px solid rgba(226, 232, 240, 0.9) !important;
      background: #ffffff !important;
    }
    .swal2-popup.swal2-toast {
      pointer-events: auto !important;
      padding: 0.85rem 1.3rem !important;
      border-radius: 16px !important;
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.18) !important;
      border: 1px solid rgba(226, 232, 240, 0.9) !important;
      background: #ffffff !important;
      display: flex !important;
      align-items: center !important;
    }
    .swal2-popup.swal2-toast .swal2-title {
      font-size: 0.98rem !important;
      font-weight: 600 !important;
      margin: 0 !important;
      line-height: 1.4 !important;
      color: #0f172a !important;
    }
    .swal2-popup.swal2-toast .swal2-icon {
      margin: 0 0.5rem 0 0 !important;
      transform: scale(0.85) !important;
    }
    .swal2-title:not(.swal2-toast .swal2-title) {
      font-family: 'Prompt', 'Kanit', sans-serif !important;
      font-weight: 800 !important;
      font-size: 1.5rem !important;
      color: #0f172a !important;
      margin-bottom: 0.5rem !important;
      line-height: 1.3 !important;
    }
    .swal2-html-container {
      font-family: 'Prompt', sans-serif !important;
      font-size: 1.02rem !important;
      color: #475569 !important;
      line-height: 1.6 !important;
      margin: 0.5rem 0 1.5rem 0 !important;
    }
    .swal2-actions {
      gap: 0.85rem !important;
      margin-top: 1.2rem !important;
    }
    button.swal2-styled.swal2-confirm {
      border-radius: 14px !important;
      padding: 0.8rem 1.8rem !important;
      font-size: 1rem !important;
      font-weight: 700 !important;
      font-family: 'Prompt', sans-serif !important;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15) !important;
      transition: all 0.2s ease !important;
      border: none !important;
    }
    button.swal2-styled.swal2-confirm:hover {
      transform: translateY(-2px) !important;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25) !important;
    }
    button.swal2-styled.swal2-cancel {
      border-radius: 14px !important;
      padding: 0.8rem 1.6rem !important;
      font-size: 1rem !important;
      font-weight: 600 !important;
      font-family: 'Prompt', sans-serif !important;
      background-color: #64748b !important;
      color: #ffffff !important;
      transition: all 0.2s ease !important;
      border: none !important;
    }
    button.swal2-styled.swal2-cancel:hover {
      background-color: #475569 !important;
      transform: translateY(-2px) !important;
    }
    .swal2-icon:not(.swal2-toast .swal2-icon) {
      transform: scale(1.15) !important;
      margin: 0.5rem auto 1.2rem auto !important;
    }
  </style>
  
  {% block extra_css %}{% endblock %}
</head>
<body>
  {% block body %}
    {% block content %}{% endblock %}
  {% endblock %}

  {% block extra_js %}{% endblock %}
</body>
</html>
