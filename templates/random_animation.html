{% extends 'base.html' %}

{% block title %}กำลังสุ่มคำถาม... — CS RANDOM QUIZ{% endblock %}

{% block body %}
<main class="rolling-page-container">
  <!-- Top Cancel/Exit Link -->
  <div style="position: absolute; top: 1.5rem; left: 1.5rem; z-index: 10;">
    <a href="{% url 'home' %}" class="btn-stage-admin" style="font-size: 0.9rem; padding: 0.45rem 1rem;">
      ✕ ยกเลิก / กลับหน้าหลัก
    </a>
  </div>

  <h1 class="rolling-header" id="rolling-title">กำลังสุ่มคำถาม...</h1>

  <!-- 7-Slot Machine Display -->
  <div class="slot-machine-wrapper">
    <div class="slot-dice" aria-hidden="true">🎲</div>

    <div class="slot-digit-box" id="slot-0">--</div>
    <div class="slot-digit-box" id="slot-1">--</div>
    <div class="slot-digit-box" id="slot-2">--</div>
    <div class="slot-digit-box" id="slot-3">--</div>
    <div class="slot-digit-box" id="slot-4">--</div>
    <div class="slot-digit-box" id="slot-5">--</div>
    <div class="slot-digit-box" id="slot-6">--</div>
  </div>

  <!-- Progress Dots Indicator -->
  <div class="slot-progress-dots" aria-hidden="true">
    <div class="slot-dot"></div>
    <div class="slot-dot"></div>
    <div class="slot-dot"></div>
    <div class="slot-dot"></div>
    <div class="slot-dot"></div>
    <div class="slot-dot"></div>
    <div class="slot-dot"></div>
  </div>
</main>
{% endblock %}

{% block extra_js %}
<script>
  document.addEventListener('DOMContentLoaded', () => {
    // ปลดล็อกระบบเสียงสำหรับ Safari ทันทีที่หน้าโหลด
    if (window.quizSounds) {
      window.quizSounds.unlockSafariAudio();
    }

    const targetQuestionNumber = {{ question_number }};
    const targetUrl = "{% url 'question_view' question_id %}";
    let isCancelled = false;

    // Track if user clicked cancel
    document.querySelectorAll('a[href="{% url 'home' %}"]').forEach(btn => {
      btn.addEventListener('click', () => {
        isCancelled = true;
      });
    });
    
    const slots = [
      document.getElementById('slot-0'),
      document.getElementById('slot-1'),
      document.getElementById('slot-2'),
      document.getElementById('slot-3'),
      document.getElementById('slot-4'),
      document.getElementById('slot-5'),
      document.getElementById('slot-6')
    ];
    
    const dots = document.querySelectorAll('.slot-dot');

    // Helper to format two digit number
    const pad2 = (n) => String(n).padStart(2, '0');

    // สุ่มตำแหน่งกล่องที่จะหยุดสุ่มอย่างอิสระ (0 - 6) ไม่ให้หยุดที่เดิมทุกครั้ง!
    const targetSlotIndex = Math.floor(Math.random() * slots.length);
    let currentActiveIndex = 0;
    let stepDelay = 65; // ms per step
    const startTime = Date.now();
    const totalDuration = 2200; // 2.2s

    function cycleFrame() {
      if (isCancelled) return;
      const elapsed = Date.now() - startTime;

      // 1. Move Active Golden Spotlight Border
      slots.forEach((s, idx) => {
        if (s) {
          if (idx === currentActiveIndex) {
            s.classList.add('active-target');
          } else {
            s.classList.remove('active-target');
          }
        }
      });

      // 2. Cycle Progress Dots
      dots.forEach((d, i) => {
        d.classList.toggle('active', i === (currentActiveIndex % dots.length));
      });

      // 3. Randomize digits across all slots
      slots.forEach((slot) => {
        if (slot) {
          const rand = Math.floor(Math.random() * 90) + 10;
          slot.textContent = pad2(rand);
        }
      });

      // 4. Play Mechanical Wheel Audio Tick
      if (window.quizSounds) {
        const pitch = 440 + (currentActiveIndex * 65);
        window.quizSounds.playSlotTick(pitch);
      }

      // 5. Deceleration Logic (Roulette Wheel Curve)
      if (elapsed < totalDuration - 700) {
        // Fast Running Phase
        currentActiveIndex = (currentActiveIndex + 1) % slots.length;
        setTimeout(cycleFrame, stepDelay);
      } else if (elapsed < totalDuration) {
        // Decelerating Phase
        stepDelay += 45;
        currentActiveIndex = (currentActiveIndex + 1) % slots.length;
        setTimeout(cycleFrame, stepDelay);
      } else {
        // 6. Lock Firmly onto the Randomized Winning Slot
        currentActiveIndex = targetSlotIndex;
        slots.forEach((s, idx) => {
          if (s) {
            if (idx === targetSlotIndex) {
              s.textContent = pad2(targetQuestionNumber);
              s.classList.add('active-target');
            } else {
              s.textContent = pad2(Math.floor(Math.random() * 88) + 10);
              s.classList.remove('active-target');
            }
          }
        });

        // Winning dot lock
        dots.forEach((d, i) => d.classList.toggle('active', i === (targetSlotIndex % dots.length)));

        // Play Winning Chime!
        if (window.quizSounds) {
          window.quizSounds.playSlotLock();
        }

        // Smooth transition to Question Page
        setTimeout(() => {
          if (!isCancelled) {
            window.location.href = targetUrl;
          }
        }, 850);
      }
    }

    // Start cycling!
    cycleFrame();
  });
</script>
{% endblock %}
