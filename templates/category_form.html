{% extends 'admin_base.html' %}

{% block title %}แก้ไขประเภทคำถาม — CS RANDOM QUIZ{% endblock %}

{% block admin_content %}
<div class="admin-card" style="max-width: 600px; margin: 2rem auto;">
  <div class="admin-card-header">
    <h1 class="admin-card-title">แก้ไขประเภทคำถาม: {{ category.name }}</h1>
    <a href="{% url 'admin_category_list' %}" style="color: #64748b;">✕ ปิด</a>
  </div>

  <form method="POST">
    {% csrf_token %}
    <div class="form-group">
      <label class="form-label" for="id_name">ชื่อประเภทคำถาม</label>
      {{ form.name }}
    </div>

    <div class="form-group">
      <label class="form-label" for="id_color">สีประจำประเภท (HEX)</label>
      {{ form.color }}
    </div>

    <div class="form-actions-row">
      <a href="{% url 'admin_category_list' %}" class="btn-secondary-cancel">ยกเลิก</a>
      <button type="submit" class="btn-primary-save">💾 บันทึกการแก้ไข</button>
    </div>
  </form>
</div>
{% endblock %}
